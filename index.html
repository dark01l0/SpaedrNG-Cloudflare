<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SpaedrNG Cloudflare Builder</title>

  <style>
    :root {
      --red: #e50914;
      --red2: #ff3340;
      --bg: #07080c;
      --card: #11131a;
      --card2: #171a23;
      --text: #f5f5f5;
      --muted: #8e94a3;
      --line: #272b36;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #240005 0%, transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .container {
      width: min(92%, 560px);
      margin: auto;
      padding: 35px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 5px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .title span {
      color: var(--red2);
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 14px;
    }

    .card {
      background: linear-gradient(
        145deg,
        rgba(23,26,35,.97),
        rgba(12,14,20,.97)
      );
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,.35);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #c7cad3;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0b0d12;
      color: white;
      outline: none;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(229,9,20,.12);
    }

    .ltr {
      direction: ltr;
      text-align: left;
    }

    .token-box {
      position: relative;
    }

    .token-box input {
      padding-left: 55px;
    }

    .show-token {
      position: absolute;
      left: 10px;
      top: 9px;
      border: 0;
      background: var(--card2);
      color: #ddd;
      border-radius: 9px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .build {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 15px;
      background: linear-gradient(
        135deg,
        var(--red),
        var(--red2)
      );
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .build:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      background: #0b0d12;
      border: 1px solid var(--line);
      color: #c9ccd5;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result {
      margin-top: 18px;
      display: none;
    }

    .result-item {
      background: #0b0d12;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px;
      margin-top: 9px;
    }

    .result-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .result-value {
      direction: ltr;
      text-align: left;
      word-break: break-all;
      color: white;
      font-size: 13px;
    }

    .copy {
      width: 100%;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: var(--green);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
      text-align: center;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 20px;
    }

    .footer a {
      color: var(--red2);
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">🕷️</div>

    <div class="title">
      Ｓｐａｅｄｒ<span>ＮＧ</span>
    </div>

    <div class="subtitle">
      ساخت خودکار پنل Cloudflare
    </div>

  </div>


  <div class="card">

    <div class="section-title">
      🚀 ساخت پنل جدید
    </div>


    <label>
      ایمیل Cloudflare
    </label>

    <input
      id="email"
      type="email"
      placeholder="example@gmail.com"
      autocomplete="email"
    >


    <label>
      Cloudflare Account ID
    </label>

    <input
      id="accountId"
      class="ltr"
      type="text"
      placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      autocomplete="off"
    >


    <label>
      Cloudflare API Token
    </label>

    <div class="token-box">

      <input
        id="token"
        type="password"
        placeholder="Cloudflare API Token"
        autocomplete="off"
      >

      <button
        class="show-token"
        type="button"
        onclick="toggleToken()"
      >
        👁️
      </button>

    </div>


    <label>
      نام پروژه
    </label>

    <input
      id="project"
      class="ltr"
      type="text"
      placeholder="spaedrng-panel"
      value="spaedrng-panel"
      maxlength="50"
    >


    <button
      id="buildBtn"
      class="build"
      onclick="buildPanel()"
    >
      🚀 ساخت Worker + D1 + KV
    </button>


    <div
      id="status"
      class="status"
    ></div>


    <div
      id="result"
      class="result"
    >

      <div class="section-title">
        ✅ ساخته شد
      </div>


      <div class="result-item">

        <div class="result-label">
          Worker
        </div>

        <div
          id="workerName"
          class="result-value"
        ></div>

      </div>


      <div class="result-item">

        <div class="result-label">
          Worker URL
        </div>

        <div
          id="workerUrl"
          class="result-value"
        ></div>

      </div>


      <div class="result-item">

        <div class="result-label">
          D1 Database
        </div>

        <div
          id="d1Name"
          class="result-value"
        ></div>

      </div>


      <div class="result-item">

        <div class="result-label">
          D1 ID
        </div>

        <div
          id="d1Id"
          class="result-value"
        ></div>

      </div>


      <div class="result-item">

        <div class="result-label">
          KV Namespace
        </div>

        <div
          id="kvName"
          class="result-value"
        ></div>

      </div>


      <div class="result-item">

        <div class="result-label">
          KV ID
        </div>

        <div
          id="kvId"
          class="result-value"
        ></div>

      </div>


      <button
        class="copy"
        onclick="copyResult()"
      >
        📋 کپی اطلاعات
      </button>

    </div>

  </div>


  <div class="note">

    🔒 API Token در این صفحه ذخیره نمی‌شود.

    <br>

    ⚠️ API Token خود را در GitHub یا برای دیگران منتشر نکن.

  </div>


  <div class="footer">

    SpaedrNG

    <br>

    <a
      href="https://t.me/spaedrNG"
      target="_blank"
    >
      کانال تلگرام
    </a>

  </div>

</div>


<script>

const PROVISIONER =
  "https://spaedrng-provisioner.prod-relay-2ffb0d.workers.dev/api/provision";


function toggleToken() {

  const input =
    document.getElementById("token");

  input.type =
    input.type === "password"
      ? "text"
      : "password";
}


function showStatus(message) {

  const box =
    document.getElementById("status");

  box.style.display = "block";

  box.textContent = message;
}


async function buildPanel() {

  const email =
    document.getElementById("email")
      .value
      .trim();


  const accountId =
    document.getElementById("accountId")
      .value
      .trim();


  const token =
    document.getElementById("token")
      .value
      .trim();


  const project =
    document.getElementById("project")
      .value
      .trim();


  const button =
    document.getElementById("buildBtn");


  const result =
    document.getElementById("result");


  if (!email) {

    showStatus(
      "❌ ایمیل Cloudflare را وارد کنید."
    );

    return;
  }


  if (!accountId) {

    showStatus(
      "❌ Cloudflare Account ID را وارد کنید."
    );

    return;
  }


  if (!token) {

    showStatus(
      "❌ Cloudflare API Token را وارد کنید."
    );

    return;
  }


  if (!project) {

    showStatus(
      "❌ نام پروژه را وارد کنید."
    );

    return;
  }


  button.disabled = true;

  result.style.display = "none";


  showStatus(
    "⏳ در حال اتصال به Cloudflare...\n\n" +
    "لطفاً صفحه را نبندید."
  );


  try {

    const response =
      await fetch(
        PROVISIONER,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            email,
            accountId,
            token,
            project

          })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "ساخت پنل ناموفق بود."
      );

    }


    document.getElementById(
      "workerName"
    ).textContent =
      data.worker?.name || "-";


    document.getElementById(
      "workerUrl"
    ).textContent =
      data.worker?.url || "-";


    document.getElementById(
      "d1Name"
    ).textContent =
      data.d1?.name || "-";


    document.getElementById(
      "d1Id"
    ).textContent =
      data.d1?.id || "-";


    document.getElementById(
      "kvName"
    ).textContent =
      data.kv?.title || "-";


    document.getElementById(
      "kvId"
    ).textContent =
      data.kv?.id || "-";


    result.style.display =
      "block";


    showStatus(
      "✅ Worker، D1 و KV با موفقیت ساخته شدند."
    );


    window.__lastResult =
      data;


  } catch (error) {

    showStatus(
      "❌ خطا:\n\n" +
      error.message
    );

  } finally {

    button.disabled = false;

  }

}


async function copyResult() {

  const data =
    window.__lastResult;


  if (!data) {
    return;
  }


  const text = [

    "SpaedrNG",

    "",

    "Worker: " +
      (data.worker?.name || "-"),

    "Worker URL: " +
      (data.worker?.url || "-"),

    "D1: " +
      (data.d1?.name || "-"),

    "D1 ID: " +
      (data.d1?.id || "-"),

    "KV: " +
      (data.kv?.title || "-"),

    "KV ID: " +
      (data.kv?.id || "-")

  ].join("\n");


  try {

    await navigator.clipboard.writeText(
      text
    );

    showStatus(
      "✅ اطلاعات کپی شد."
    );

  } catch {

    showStatus(text);

  }

}

</script>

</body>
  </html>
